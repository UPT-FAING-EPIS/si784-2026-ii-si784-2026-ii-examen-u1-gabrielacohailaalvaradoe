name: Infrastructure

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed Terraform plan
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        run: >-
          terraform -chdir=infra init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=university-social.tfstate"
          -backend-config="use_azuread_auth=true"
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate
      - name: Terraform plan
        run: terraform -chdir=infra plan -out=tfplan -input=false
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          retention-days: 7
      - name: Terraform apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: terraform -chdir=infra apply -auto-approve -input=false tfplan
